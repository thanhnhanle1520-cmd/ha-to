<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HA TO</title>
<style>
:root{--brand:#ee0033;--bg:#f5f6f8;--line:#e5e7eb;--text:#1f2937;--mut:#6b7280;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 11px}
button:hover{background:#f9fafb}
button.pri{background:var(--brand);border-color:var(--brand);color:#fff}button.pri:hover{filter:brightness(.93)}
button.dng{color:var(--bad);border-color:#fecaca}
button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{border:1px solid #d1d5db;border-radius:6px;padding:5px 8px;background:#fff;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #fecdd6;border-color:var(--brand)}
input[type=number]{text-align:right}
textarea{width:100%;min-height:60px;resize:vertical}
/* menu trái: thu gọn chỉ icon */
#nav{width:52px;flex:none;background:#1f2937;color:#e5e7eb;display:flex;flex-direction:column;position:relative;z-index:30;transition:width .15s;overflow:hidden}
#nav.open,#nav.hover{width:210px;box-shadow:2px 0 10px rgba(0,0,0,.25)}
#nav .logo{height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;font-weight:700;color:#fff;border-bottom:1px solid #374151;white-space:nowrap;cursor:pointer}
#nav .logo b{background:var(--brand);border-radius:5px;padding:1px 6px;font-size:13px}
#nav a{display:flex;align-items:center;gap:12px;padding:9px 16px;color:#d1d5db;text-decoration:none;white-space:nowrap}
#nav a:hover{background:#374151}#nav a.on{background:var(--brand);color:#fff}
#nav .ic{width:20px;text-align:center;font-size:16px;flex:none}
#nav .lb{opacity:0;transition:opacity .1s}#nav.open .lb,#nav.hover .lb{opacity:1}
#nav .spacer{flex:1}#nav .me{font-size:11px;color:#9ca3af;padding:8px 16px;white-space:nowrap;overflow:hidden}
#nav .me,#nav .pin{opacity:0}#nav.open .me,#nav.hover .me,#nav.open .pin,#nav.hover .pin{opacity:1}
/* nội dung */
#main{flex:1;min-width:0;height:100vh;overflow:auto;position:relative}
#bar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:7px 14px;min-height:44px}
#bar h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .acts{display:flex;gap:6px;flex-wrap:wrap}
#loading{position:fixed;left:0;top:0;height:3px;background:var(--brand);width:0;transition:width .3s;z-index:99}
#view{padding:12px 14px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:14px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;padding:10px 12px}
.kpi .v{font-size:20px;font-weight:700}.kpi .l{color:var(--mut);font-size:12px}
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.bar2 input[type=search]{min-width:240px}
/* bảng */
.tw{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
table.t{border-collapse:collapse;width:100%;min-width:600px}
table.t th{position:sticky;top:0;background:#f3f4f6;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:12px;white-space:nowrap;cursor:default}
table.t th.s{cursor:pointer}table.t td{padding:5px 8px;border-bottom:1px solid #f1f2f4;vertical-align:top}
table.t tr.rw:hover td{background:#fff7f8;cursor:pointer}
td.r,th.r{text-align:right;white-space:nowrap}td.c,th.c{text-align:center}
tfoot td{font-weight:700;background:#fafafa}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:8px 2px;color:var(--mut)}
.badge{display:inline-block;border-radius:10px;padding:1px 8px;font-size:11.5px;background:#e5e7eb;white-space:nowrap}
.b-ok{background:#dcfce7;color:#166534}.b-warn{background:#fef3c7;color:#92400e}.b-bad{background:#fee2e2;color:#991b1b}.b-info{background:#dbeafe;color:#1e40af}
.mut{color:var(--mut)}.neg{color:var(--bad)}.pos{color:var(--ok)}
/* tab */
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:0 0 10px}
.tabs a{padding:7px 12px;text-decoration:none;color:var(--mut);border-bottom:2px solid transparent;cursor:pointer}
.tabs a.on{color:var(--brand);border-color:var(--brand);font-weight:600}
#kpibar{position:sticky;top:44px;z-index:15;background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;gap:22px;flex-wrap:wrap;padding:6px 14px;margin-bottom:10px;align-items:center}
#kpibar .i span{display:block;font-size:11px;color:var(--mut)}#kpibar .i b{font-size:14px}
.prog{background:#e5e7eb;border-radius:5px;height:8px;overflow:hidden;min-width:70px}.prog i{display:block;height:100%;background:var(--brand)}
/* form */
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px 12px}
.fg label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
.fg label input,.fg label select,.fg label textarea{color:var(--text);font-size:13.5px;width:100%}
.fg .full{grid-column:1/-1}
.req:after{content:" *";color:var(--bad)}
/* modal */
#modals .ov{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 10px;z-index:60;overflow:auto}
#modals .md{background:#fff;border-radius:10px;width:min(560px,100%);box-shadow:0 20px 50px rgba(0,0,0,.3)}
#modals .md.wide{width:min(900px,100%)}
#modals .mh{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center}#modals .mh b{flex:1}
#modals .mb{padding:14px}#modals .mf{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
#toasts{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;z-index:100;max-width:min(460px,90vw)}
.toast{background:#111827;color:#fff;border-radius:8px;padding:9px 12px;box-shadow:0 6px 18px rgba(0,0,0,.3)}.toast.err{background:#b91c1c}
/* dòng hàng */
table.le{border-collapse:collapse;width:100%;min-width:720px}
table.le th{background:#f3f4f6;font-size:12px;padding:5px;border:1px solid var(--line);white-space:nowrap}
table.le td{border:1px solid var(--line);padding:2px}
table.le input{width:100%;border:1px solid transparent;background:transparent;padding:4px 5px}table.le input:hover{border-color:#d1d5db}table.le input:focus{background:#fff}
table.le td.n input{text-align:right}
.pick{position:relative}.pick .dd{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid #d1d5db;border-radius:6px;max-height:280px;overflow:auto;z-index:25;box-shadow:0 8px 20px rgba(0,0,0,.15)}
.pick .dd div{padding:6px 9px;cursor:pointer;border-bottom:1px solid #f3f4f6}.pick .dd div:hover{background:#fff1f3}.pick .dd small{color:var(--mut)}
#gsw .dd{background:#fff;border:1px solid #d1d5db;border-radius:8px;box-shadow:0 10px 24px rgba(0,0,0,.18)}#gsw .dd .it{border-bottom:1px solid #f3f4f6}#gsw .dd .it:hover{background:#fff1f3}
.chart text{font-size:10px;fill:#6b7280}
/* ===== Giao diện HATO: đỏ #E31E24 (hành động chính), xanh #0B5CA8 (liên kết, tiêu đề bảng), navy #10294A (menu), nền #F4F6F9 ===== */
:root{--brand:#e31e24;--blue:#0b5ca8;--navy:#10294a;--bg:#f4f6f9;--line:#dde3ea;--text:#1b2430;--mut:#5b6877;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
body{font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
a{color:var(--blue)}
#nav{background:var(--navy)}#nav a:hover{background:#1c3d69}#nav .logo{border-bottom-color:#27456f}
button.pri:hover{filter:none;background:#c4151b}
button:hover{background:#eef3f9}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid #9cc4ec;outline-offset:1px}
input:focus,select:focus,textarea:focus{outline:2px solid #9cc4ec;border-color:var(--blue)}
table.t th{background:#fff;color:var(--blue);border-bottom:2px solid var(--blue);font-weight:600}
table.t td,table.t th,table.le td,table.le input,.fg input,.fg select{font-variant-numeric:tabular-nums}
table.t tr.rw:hover td{background:#eef5fc}
table.le th{background:#fff;color:var(--blue);border-bottom:2px solid var(--blue)}
.card{box-shadow:none}.card h3{color:var(--navy);font-size:15px}
.card table{border-collapse:collapse;width:100%;min-width:520px;font-variant-numeric:tabular-nums}.card th{text-align:left;padding:5px 8px;color:var(--blue);border-bottom:2px solid var(--blue);font-size:12px;white-space:nowrap}.card th.r,.card td.r{text-align:right}.card td{padding:5px 8px;border-bottom:1px solid #edf0f4}
td.rem{color:var(--warn);font-weight:600;background:#fff8ec}
.b-ok{background:#dcfce7;color:#14532d}.b-warn{background:#fef3c7;color:#78350f}.b-bad{background:#fee2e2;color:#7f1d1d}.b-info{background:#dbeafe;color:#1e3a8a}
input.flatpickr-input.form-control,.flatpickr-input[readonly],input.flatpickr-alt{width:100%}
.flatpickr-day.selected{background:var(--blue);border-color:var(--blue)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.chips{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}.chip{border:1px solid #e5e7eb;background:#fff;color:#6b7280;border-radius:12px;padding:0 7px;font-size:11px;line-height:18px;cursor:pointer;white-space:nowrap}.chip:hover{border-color:#3b5b92;color:#3b5b92;background:#f1f5fb}
@media(max-width:760px){.hide-sm{display:none!important}}
/* ô chọn có thể gõ tay */
.cb{position:relative;display:flex}.cb>input{flex:1;min-width:0;border-top-right-radius:0;border-bottom-right-radius:0}
.cb-btn{border-left:0;border-top-left-radius:0;border-bottom-left-radius:0;padding:0 9px;color:var(--mut)}
.cb-list{display:none;position:absolute;left:0;right:0;top:100%;z-index:60;background:#fff;border:1px solid #d1d5db;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.14);max-height:230px;overflow:auto;margin-top:2px}
.cb-it{padding:7px 10px;cursor:pointer}.cb-it:hover,.cb-it.hi{background:#f3f4f6}.cb-it.on{font-weight:600}.cb-new{color:#2563eb;border-top:1px solid var(--line)}
/* nút thu / mở menu trái */
.navtg{margin:6px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#e5e7eb;font-size:16px;line-height:1;padding:7px 0;border-radius:6px}
.navtg:hover{background:rgba(255,255,255,.08)}
@media(max-width:760px){#nav{width:44px}#nav a{padding:10px 12px;gap:10px}#nav .logo{padding:0 10px}#nav.open{width:190px}}
/* dòng vừa thêm / sửa */
@keyframes flashrow{from{background:#fef9c3}to{background:transparent}}tr.flash td{animation:flashrow 2.5s ease-out}
@media(max-width:700px){#view{padding:8px}.bar2 input[type=search]{min-width:150px;flex:1}}
/* ===== Bản 14: khung chung chuẩn hóa ===== */
/* menu nhóm + icon nét */
#nav .ic{width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:0}
#nav .ic svg{display:block}
#nav a{padding:8px 16px;gap:12px;border-left:3px solid transparent;font-size:13.5px}
#nav a:hover{background:rgba(255,255,255,.07)}
#nav a.on{background:rgba(255,255,255,.12);color:#fff;border-left-color:var(--brand);font-weight:600}
#nav .grp{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#8ea3c0;padding:12px 16px 3px 19px;white-space:nowrap;overflow:hidden;opacity:0;height:0;padding-top:0;padding-bottom:0;border-top:1px solid rgba(255,255,255,.08);margin:6px 10px 2px}
#nav .grp.first{border-top:0;margin-top:2px}
#nav.open .grp,#nav.hover .grp{opacity:1;height:auto;padding:10px 6px 3px 9px;border-top:0;margin:0}
#nav .grp,#nav a,#nav .logo,#nav .me{flex:none}   /* bản 35: màn hình thấp — không ép co tên nhóm (bị cắt nửa chữ); menu cuộn dọc */
#nav{overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
#nav .grp{line-height:1.4}
.stkkpi{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.kpi.neg .v{color:var(--bad,#b91c1c)}.kpi.neg{border-left-color:#b91c1c}th.stkdk,td.stkdk{background:#f6f9fc}a.stkpl{color:inherit;text-decoration:underline dotted}
#nav .logo b{font-size:12.5px}
/* thanh tiêu đề: chiều cao chuẩn */
#bar{min-height:52px;padding:0 16px;gap:12px}
#bar h1{font-size:16.5px;font-weight:650;color:var(--navy)}
#bar .acts{flex-wrap:nowrap;align-items:center}
#bar .acts button{white-space:nowrap}
/* trạng thái đồng bộ dạng biểu tượng trên thanh tiêu đề */
#hato-sync.inbar{position:static!important;transform:none!important;box-shadow:none!important;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line)!important;border-radius:999px;padding:4px 10px!important;font-size:12.5px!important;background:#fff;white-space:nowrap;cursor:pointer;flex:none;max-width:260px;overflow:hidden;text-overflow:ellipsis}
#hato-sync .dot{width:8px;height:8px;border-radius:50%;flex:none}
#hato-sync button{border:0;border-radius:6px;padding:2px 9px;color:#fff;font-size:12px}
/* thanh lọc chuẩn: tìm kiếm trái · bộ lọc giữa · nút phải */
.bar2{gap:8px;margin-bottom:8px}
.bar2 input[type=search]{flex:0 1 300px;min-width:200px}
.bar2 .sp{flex:1 1 0;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff;flex-wrap:nowrap}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line);padding:4px 10px;background:#fff;white-space:nowrap;font-size:13px}
.seg button:last-child{border-right:0}.seg button.on{background:var(--navy);color:#fff}.seg button small{color:inherit;opacity:.75}
/* bảng: không xuống dòng, chữ dài cắt …, số căn phải, mã dễ nhận */
table.t td{white-space:nowrap;padding:6px 9px;vertical-align:middle}
table.t td.wr{white-space:normal}
table.t td .ellx{max-width:min(36vw,620px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar2 select{max-width:280px}
table.t td.code,table.t td:first-child a{font-weight:600}
table.t td.code{color:var(--navy);letter-spacing:.01em}
table.t th{padding:7px 9px}
td.r,th.r{text-align:right}
/* khung công việc gọn */
.taskbox{border-left:4px solid var(--blue)}
.taskbox .bar2:last-child{margin-bottom:0}
@media(max-width:760px){#bar{flex-wrap:wrap;row-gap:6px;padding:6px 10px;min-height:48px}#bar h1{flex:1 1 50%;min-width:0}#bar #gsw{order:5;flex:1 1 100%}#bar #gs{width:100%!important;max-width:none!important}#bar .acts{flex-wrap:wrap}.bar2 input[type=search]{flex:1 1 100%}.seg{overflow-x:auto;max-width:100%}#hato-sync.inbar .tx{display:none}#bar{padding:0 10px}}
/* quy trình dự án */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.flow-step{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fafbfc}
.flow-step.on{background:#fff;border-top:3px solid var(--blue)}
.flow-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.flow-n{width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.flow-step:not(.on) .flow-n{background:#c3ccd8}
.flow-it{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dashed #edf0f4;font-size:13px;white-space:nowrap;overflow:hidden}
.flow-it:last-child{border-bottom:0}.flow-it:hover{background:#f4f8fd}
.flow-it .code{font-weight:600;color:var(--navy)}.flow-it .mut{overflow:hidden;text-overflow:ellipsis;min-width:0}
#kpibar{gap:26px}
/* form chuẩn */
.fg label.bad input,.fg label.bad select,.fg label.bad textarea{border-color:var(--bad);background:#fff7f7}
.fg .ferr{color:var(--bad);font-size:11.5px}
.fmore{border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.fmore>summary{cursor:pointer;color:var(--blue);font-size:13px;padding:4px 0;list-style:none}
.fmore>summary::before{content:'▸ ';}.fmore[open]>summary::before{content:'▾ ';}
.fmore>.fg{margin-top:6px}
#modals .mf button.pri{order:9}#modals .mf button.dng{margin-right:auto;order:-1}
/* bản 18: tóm tắt trên Tổng quan dự án + loại tệp */
.sumcards{margin-bottom:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.sumcards .card{margin:0;min-width:0}
.sumcard .sh{display:flex;align-items:center;justify-content:space-between;gap:8px}.sumcard .sh h3{margin:0}.sumcard .sh a{font-size:13px;white-space:nowrap}
.sumcard .tot{font-weight:600;margin:6px 0 4px}
.srows{font-size:13px}.sr{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-top:1px solid #eef0f3}.sr .sd{flex:0 0 74px;white-space:nowrap}.sr .sl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sr .sa{flex:0 0 auto;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
select.mini{padding:2px 4px;font-size:12px;height:auto;min-height:0}
details.pobox{margin:0 0 10px;border:1px solid #dbe3ee;border-radius:8px;padding:6px 10px;background:#f8fafc}details.pobox>summary{cursor:pointer;font-weight:600;color:#1e3a5f;padding:2px 0}details.pobox[open]>summary{margin-bottom:8px}
/* bản 30: nút có biểu tượng, cột chọn, xuất hàng loạt */
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button.hasic{display:inline-flex;align-items:center;gap:6px}
button.hasic .bi{display:inline-flex;flex:none}
#main button.ionly{padding:5px 8px}
#main button.ionly .lb{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(max-width:640px){#bar .acts button.hasic:not(.pri){padding:5px 8px}#bar .acts button.hasic:not(.pri) .lb{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}}
button.mbtn{display:inline-flex;align-items:center;gap:4px}button.mbtn .car{font-size:10px;opacity:.7}
.pop{position:fixed;z-index:200;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(15,27,61,.18);padding:4px;display:flex;flex-direction:column;min-width:120px}
.pop button{border:0;text-align:left;border-radius:6px;padding:7px 10px}.pop button:hover{background:#eef3f9}
table.t th.ck,table.t td.ck{width:30px;text-align:center;padding-left:6px;padding-right:2px}
table.t td.ck input,table.t th.ck input{width:16px;height:16px;cursor:pointer;margin:0}
table.t tr.picked td{background:#fff7f7}
.selbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 8px;padding:6px 10px;border:1px solid #fecaca;background:#fff5f5;border-radius:8px}
.selbar b{color:var(--brand);margin-right:4px}
button.lnk{border:0;background:none;color:#1d4ed8;padding:4px 6px}button.lnk:hover{background:none;text-decoration:underline}
.tkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 16px}
.tkkv{display:flex;flex-direction:column;font-size:13px;min-width:0}.tkkv span{font-size:11.5px}.tkkv b{font-weight:600;overflow-wrap:anywhere}

<script>
/* ===== Nhập dữ liệu từ file Excel / CSV ===== */
var XLSX_URL = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
var IMPORT_MAX_ROWS = 1000, IMPORT_MAX_BYTES = 10 * 1024 * 1024;

function loadXlsxLib() {
  if (window.XLSX) return Promise.resolve();
  return new Promise(function (res, rej) {
    var s = document.createElement('script'); s.src = XLSX_URL; s.onload = res;
    s.onerror = function () { rej(new Error('Không tải được thư viện đọc Excel. Hãy lưu file thành CSV rồi nhập lại.')); };
    document.head.appendChild(s);
  });
}
function parseDelimited(text) {            // CSV (dấu , hoặc ;) hoặc TSV
  text = text.replace(/^﻿/, '');
  var first = text.split(/\r?\n/)[0] || '', d = '\t';
  if (first.indexOf('\t') < 0) d = (first.split(';').length > first.split(',').length) ? ';' : ',';
  var rows = [], row = [], cur = '', q = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === d) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
function readTableFile(file) {              // -> Promise<mảng các dòng (mảng ô)>
  if (file.size > IMPORT_MAX_BYTES) return Promise.reject(new Error('File quá lớn (tối đa 10MB).'));
  var ext = (file.name.split('.').pop() || '').toLowerCase();
  return new Promise(function (res, rej) {
    var fr = new FileReader(); fr.onerror = function () { rej(new Error('Không đọc được file.')); };
    if ((ext === 'xlsx' || ext === 'xlsm') && window.XlsxLite && XlsxLite.readFull) {
      fr.onload = function () {
        XlsxLite.readFull(fr.result).then(function (bk) {
          var best = bk.sheets.slice().sort(function (a, b) { return b.rows.filter(function (r) { return r && r.length; }).length - a.rows.filter(function (r) { return r && r.length; }).length; })[0];
          res((best ? best.rows : []).map(function (r) { return (r || []).map(function (v) { return v == null ? '' : v; }); }));
        }).catch(function (e) { rej(new Error('Không đọc được file Excel: ' + e.message)); });
      };
      fr.readAsArrayBuffer(file);
    } else if (ext === 'xlsx' || ext === 'xls' || ext === 'xlsm') {
      fr.onload = function () {
        loadXlsxLib().then(function () {
          if (!window.XLSX) throw new Error('File .xls (Excel cũ) chưa đọc được: hãy mở bằng Excel, lưu lại thành .xlsx hoặc .csv rồi nhập.');
          var wb = XLSX.read(fr.result, { type: 'array', cellDates: false });
          var ws = wb.Sheets[wb.SheetNames[0]];
          res(XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' }));
        }).catch(rej);
      };
      fr.readAsArrayBuffer(file);
    } else if (ext === 'csv' || ext === 'txt' || ext === 'tsv') {
      fr.onload = function () { res(parseDelimited(String(fr.result))); }; fr.readAsText(file, 'utf-8');
    } else rej(new Error('Chỉ nhận file .xlsx, .xls, .csv.'));
