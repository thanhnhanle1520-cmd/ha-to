# Tự chạy kiểm thử mỗi lần đưa code lên GitHub. Kết quả: tab "Actions" của repo (xanh = đạt, đỏ = có lỗi).
name: Kiem thu HA TO
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chay kiem thu
        run: bash test/run_all.sh
