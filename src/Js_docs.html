          })))));
        host.appendChild(h('div', { class: 'bar2', style: 'margin-top:6px' }, h('button', { onclick: function () { rs.forEach(function (r) { if (r.remaining > 0 && !lines.some(function (l) { return l.doc_item_id === r.doc_item_id; })) lines.push({ id: '', doc_id: r.doc_id, doc_item_id: r.doc_item_id, doc_code: r.doc_code, code: r.code, name: r.name, model: r.model, unit: r.unit, qty: r.remaining, note: '' }); }); le.redraw(); } }, 'Thêm tất cả hàng còn lại')));
      }
      pick.append(h('div', { class: 'bar2' }, s), host);
      if (!rows.length) pick.appendChild(h('div', { class: 'mut' }, 'Dự án chưa có HĐ / PO / Phụ lục HĐ. Chuyển báo giá thành văn bản trước, hoặc nhập hàng ngoài văn bản bên dưới.'));
      if (isNew && q.doc && docsMap[q.doc] && !lines.length) {       // mở từ nút "Tạo phiếu giao" của PO / HĐ: điền sẵn hàng còn lại
        s.value = q.doc; drawRows();
        rows.forEach(function (r) { if (r.doc_id === q.doc && r.remaining > 0) lines.push({ id: '', doc_id: r.doc_id, doc_item_id: r.doc_item_id, doc_code: r.doc_code, code: r.code, name: r.name, model: r.model, unit: r.unit, qty: r.remaining, note: '' }); });
        if (!lines.length) toast('Văn bản này đã giao hết hàng.', true);
      }
      lines.forEach(function (l) { if (!l.doc_code && l.doc_id && docsMap[l.doc_id]) l.doc_code = docsMap[l.doc_id]; }); le.redraw();
    });
    if (!canEdit) v.querySelectorAll('input,select,textarea').forEach(function (e) { e.disabled = true; });
    else S.draftCtl = draftWatch({ id: 'delivery/' + (isNew ? 'new:' + (q.project || '') : id), label: 'Giao hàng ' + (isNew ? 'mới' : dv.code), hash: location.hash, root: v,
      get: function () { return { f: f.get(), lines: lines.map(function (x) { return Object.assign({}, x); }) }; },
      set: function (d) { formSet(f, d.f); lines.length = 0; (d.lines || []).forEach(function (x) { lines.push(x); }); le.redraw(); } });
  });
};


/* Giá mua chốt theo đơn mua: đơn mua "Đã đặt" tự điền dòng chưa chốt; dòng đã chốt tay khác giá đơn mua → nút áp giá */
function buyFillBar(buy, lines, le, canEdit) {
  var n = Object.keys(buy).length; if (!n) return null;
  var diff = function () { return lines.filter(function (l) { var b = buy[l.id]; return b && num(l.cost) !== b.price; }); };
  var info = h('span', { class: 'mut', id: 'buyInfo' }), btn = h('button', { id: 'btnBuyFill', onclick: function () {
    var ds = diff(); if (!ds.length) return toast('Giá chốt đã khớp giá đơn mua.');
    confirmBox('Áp giá từ đơn mua cho ' + ds.length + ' dòng đang có giá chốt khác? (Bấm Lưu để ghi)', function () { ds.forEach(function (l) { l.cost = buy[l.id].price; l.cost_src = buy[l.id].pids; }); le.redraw(); upd(); });
  } }, 'Lấy giá từ đơn mua');
  function upd() { var k = diff().length; info.textContent = n + ' dòng đã có đơn mua / tờ khai' + (k ? ' · ' + k + ' dòng giá chốt khác giá đơn mua / tờ khai' : ' · giá chốt khớp đơn mua / tờ khai'); btn.style.display = k && canEdit ? '' : 'none'; }
  upd();
  return h('div', { class: 'bar2', style: 'margin-bottom:6px' }, btn, info);
}
/* ---- Tệp đính kèm của HĐ / PO / PLHD (hồ sơ scan) — lưu Drive: Năm / Khách hàng / Dự án / Mã văn bản ---- */
function docFilesCard(doc, isNew, pending) {
  var card = h('div', { class: 'card' }), list = h('div'), st = h('span', { class: 'mut' });
  var inp = h('input', { type: 'file', multiple: true, accept: '.pdf,.jpg,.jpeg,.png,.heic,.doc,.docx,.xls,.xlsx,.zip,.rar' });
  card.appendChild(h('h3', null, '📎 Tệp đính kèm (hồ sơ scan)'));
  if (isNew) {
    var draw0 = function () { list.innerHTML = ''; pending.forEach(function (f0, i) { list.appendChild(h('div', { class: 'bar2' }, '📄 ' + f0.name + ' · ' + fileSize(f0.size), h('button', { class: 'dng', onclick: function () { pending.splice(i, 1); draw0(); } }, '✕'))); }); if (!pending.length) list.appendChild(h('div', { class: 'mut' }, 'Chọn tệp ngay bây giờ; tệp được tải lên Drive sau khi bấm Lưu.')); };
    inp.onchange = function () { Array.prototype.slice.call(inp.files).forEach(function (f0) { if (f0.size > FILE_MAX) toast(f0.name + ': quá 50MB', true); else pending.push(f0); }); inp.value = ''; draw0(); };
    if (S.perms.files.create) card.appendChild(h('div', { class: 'bar2' }, inp));
    card.appendChild(list); draw0(); return card;
  }
  function load() {
    return call('list', { table: 'files', project_id: doc.project_id }).then(function (rows) {
      rows = rows.filter(function (r) { return r.doc_id === doc.id; }); list.innerHTML = '';
      if (!rows.length) { list.appendChild(h('div', { class: 'mut' }, 'Chưa có tệp đính kèm.')); return; }
      list.appendChild(filesTable(rows, false, load));
    });
  }
  if (S.perms.files.create) card.appendChild(h('div', { class: 'bar2' }, inp, h('button', { class: 'pri', onclick: function () {
    var fl = Array.prototype.slice.call(inp.files); if (!fl.length) return toast('Chọn tệp trước', true);
    uploadFiles(fl, { project_id: doc.project_id, doc_id: doc.id }, st).then(function (n) { if (n) toast('Đã đính kèm ' + n + '/' + fl.length + ' tệp'); inp.value = ''; load(); });
  } }, 'Tải lên'), st, h('span', { class: 'mut' }, 'PDF, ảnh, Word, Excel… tối đa 50MB/tệp')));
  card.appendChild(list); load();
  return card;
}
