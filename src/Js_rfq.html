/* ================= Xuất ngược theo mẫu khách (từ báo giá có rfq_id) ================= */
function rfqExportCustomer(qt, lines) {
  if (!qt.rfq_id) return;
  busy(1);
  var rfq;
  return call('rfqGet', { id: qt.rfq_id }).then(function (x) {
    rfq = x; var o = (x.opts && !Array.isArray(x.opts)) ? x.opts : {};
    if (o.xls) throw new Error('File gốc là .xls (Excel cũ) nên không điền ngược giữ định dạng được. Hãy mở file khách bằng Excel, lưu lại thành .xlsx rồi nhập lại.');
    return HatoStore.getFile(o.file_key, x.file_id).then(XlsxLite.readFull).then(function (bk) {
      var sh = bk.sheets.filter(function (s) { return s.name === x.sheet; })[0];
      if (!sh) throw new Error('File gốc không còn trang tính “' + x.sheet + '”.');
      var map = (x.map && !Array.isArray(x.map)) ? x.map : {};
      var ls = [], noSrc = 0, noPrice = 0;
      lines.forEach(function (l) {
        var src = String(l.src_rows || '').split(',').map(Number).filter(function (n) { return n > 0; });
        if (!src.length) { noSrc++; return; }
        var pr = num(l.price) * (1 - num(l.disc_pct) / 100);
        if (!pr) { noPrice++; return; }
        ls.push({ src: src, qty: num(l.qty), price: Math.round(pr), model: l.model, brand: l.brand, origin: l.origin });
      });
      if (!ls.length) throw new Error('Báo giá chưa có dòng nào vừa có giá vừa thuộc file khách.');
      var plan = RfqCore.fillPlan({ map: map, header_row: num(x.header_row), header_last: num(x.header_last), width: o.width }, ls, sh.rows);
      return XlsxPatch.apply(bk.files, sh.path, plan.edits).then(function (blob) {
        var base = String(x.file_name || 'Bao gia').replace(/\.(xlsx|xlsm|xls)$/i, '');
        var a = h('a', { href: URL.createObjectURL(blob), download: base + ' - HA TO ' + qt.code + ' v' + qt.version + '.xlsx' }); document.body.appendChild(a); a.click(); setTimeout(function () { a.remove(); }, 1000);
        busy(-1);
        var msg = 'Đã xuất theo mẫu khách: ' + ls.length + ' hạng mục, tổng ' + M(plan.total) + (plan.added.length ? '. File khách không có cột giá nên đã thêm cột ' + plan.added.map(function (a2) { return '“' + a2[1] + '” (' + rfqColName(a2[0]) + ')'; }).join(', ') : '');
        if (noSrc) msg += '. ' + noSrc + ' dòng thêm tay không có trong file khách nên không điền.';
        if (noPrice) msg += '. ' + noPrice + ' dòng chưa có giá nên để trống.';
        toast(msg, !!(noSrc || noPrice));
      });
    });
  }).catch(function (e) { busy(-1); toast('Không xuất được: ' + e.message, true); });
}
