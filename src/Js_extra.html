<script>
/* ===== Tiện ích bổ sung: tìm kiếm chung, báo giá nhanh, kiểm tra trước khi xuất, gói đối chiếu, tóm tắt dự án ===== */
function printPreview(title, html, extraBtns) {
  var fr = h('iframe', { style: 'width:100%;height:72vh;border:1px solid #d1d5db;background:#fff' }); fr.srcdoc = html;
  return modal({ title: title, wide: true, body: fr, buttons: [{ label: 'In / Lưu PDF', cls: 'pri', fn: function () { try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (e) { toast('Trình duyệt chặn in.', true); } } }].concat(extraBtns || []) });
}
var PRINT_CSS = '<style>*{font-family:"Times New Roman",Times,serif}@page{size:A4;margin:20mm 15mm 20mm 30mm}body{font-size:13px;margin:0;color:#000}h2{font-size:16px;margin:0 0 4px}h3{font-size:14px;margin:10px 0 4px}table{border-collapse:collapse;width:100%;margin:8px 0}th,td{border:1px solid #888;padding:3px 5px;vertical-align:top;font-size:13px}th{background:#eee}td.r{text-align:right}.m{color:#555}@page{size:A4 landscape;margin:10mm}</style>';
function copyText(txt) {
  function fb() { var t = h('textarea', { style: 'position:fixed;left:-999px' }); t.value = txt; document.body.appendChild(t); t.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) { } t.remove(); return ok; }
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt).then(function () { return true; }, function () { return fb(); });
  return Promise.resolve(fb());
}

/* ---- Điều kiện riêng từng khách ---- */
function customerTerms(pid, cid) {
  var pj = S.projects.filter(function (x) { return x.id === pid; })[0], cu = S.customers.filter(function (c) { return c.id === (cid || (pj && pj.customer_id)); })[0];
  if (!cu || !cu.terms_pref) return null;
  try { return JSON.parse(cu.terms_pref); } catch (e) { return null; }
}

/* ---- Tổng tiền báo giá ---- */
function quoteSums(lines, vat) {
  var cost = 0; lines.forEach(function (l) { cost += num(l.qty) * num(l.cost); });
  var gs = vatGroups(lines, vat, function (l) { return num(l.qty) * num(l.price) * (1 - num(l.disc_pct) / 100); }), sub = 0, v = 0;
  gs.forEach(function (g) { sub += g.base; v += g.vat; });
  return { sub: sub, vat: v, total: sub + v, cost: cost, groups: gs };
}

/* ---- Kiểm tra trước khi xuất / gửi ---- */
function quoteIssues(rec, lines) {
  var out = [], sm = quoteSums(lines, rec.vat_pct), minc = num(S.cfg && S.cfg.min_coef);
  if (!lines.length) out.push('Báo giá chưa có dòng hàng.');
  if (!String(rec.contact_name || '').trim() && !String(rec.contact_phone || '').trim()) out.push('Chưa có người nhận / số điện thoại.');
  if (!String(rec.valid_text || '').trim()) out.push('Chưa ghi hiệu lực báo giá.');
  if (!String(rec.deliver_place || '').trim()) out.push('Chưa có địa điểm giao hàng.');
  if (!String(rec.pay_method || '').trim()) out.push('Chưa có phương thức thanh toán.');
  lines.forEach(function (l, i) { if (!(num(l.price) > 0)) out.push('Dòng ' + (i + 1) + ' (' + (l.name || '?') + '): đơn giá bằng 0.'); });
  if (minc > 0 && S.perms.canPrice) {
    if (sm.cost > 0 && sm.sub / sm.cost < minc) out.push('Hệ số trung bình ' + N(Math.round(sm.sub / sm.cost * 100) / 100) + ' thấp hơn ngưỡng tối thiểu ' + N(minc) + '.');
    lines.forEach(function (l, i) { if (num(l.cost) > 0 && num(l.price) > 0 && num(l.price) / num(l.cost) < minc) out.push('Dòng ' + (i + 1) + ' (' + (l.name || '?') + '): hệ số ' + N(Math.round(num(l.price) / num(l.cost) * 100) / 100) + ' < ngưỡng ' + N(minc) + '.'); });
  }
  return out;
}
function quoteLastPriceIssues(rec, lines) {
  var pj = S.projects.filter(function (x) { return x.id === rec.project_id; })[0]; if (!pj) return Promise.resolve([]);
  var keys = []; lines.forEach(function (l) { if (l.code) keys.push(l.code); if (l.name) keys.push(l.name); });
  return safe(call('lastPrices', { customer_id: pj.customer_id, keys: keys, exclude_id: rec.id || '' })).then(function (m) {
    var out = []; if (!m) return out;
    lines.forEach(function (l, i) {
      var e = (l.code && m[String(l.code).toLowerCase()]) || m[String(l.name || '').toLowerCase()]; if (!e) return;
      var net = Math.round(num(l.price) * (1 - num(l.disc_pct) / 100));
      if (net > 0 && net < e.price) out.push('Dòng ' + (i + 1) + ' (' + l.name + '): giá ' + M(net) + ' thấp hơn lần trước ' + M(e.price) + ' (' + e.ref + ', ' + D(e.date) + ').');
    });
    return out;
  });
}
/* trả về Promise<boolean>: true = tiếp tục */
function quoteCheck(rec, lines, goLabel) {
  return quoteLastPriceIssues(rec, lines).then(function (lp) {
    var iss = quoteIssues(rec, lines).concat(lp);
    if (!iss.length) return true;
    return new Promise(function (res) {
      var done = false; function fin(v) { if (!done) { done = true; res(v); } }
      modal({ title: 'Kiểm tra trước khi ' + (goLabel || 'xuất'), body: h('div', null, h('p', { class: 'mut' }, iss.length + ' điểm cần xem lại:'), h('ul', null, iss.map(function (x) { return h('li', { style: 'margin:3px 0' }, x); }))),
        buttons: [{ label: 'Vẫn ' + (goLabel || 'xuất'), cls: 'pri', fn: function (close) { fin(true); close(); } }], closeLabel: 'Quay lại sửa', onclose: function () { fin(false); } });
    });
  });
}

/* ---- Gửi báo giá nhanh (văn bản dán Zalo) ---- */
function quoteZaloText(rec, lines) {
  var sm = quoteSums(lines, rec.vat_pct), pj = S.projects.filter(function (x) { return x.id === rec.project_id; })[0] || {};
  var L = ['BÁO GIÁ ' + (rec.code || '') + (pj.name ? ' – ' + pj.name : ''), 'Ngày: ' + D(rec.date)];
  if (rec.contact_name) L.push('Kính gửi: ' + rec.contact_name);
  L.push('');
  lines.forEach(function (l, i) {
    var net = Math.round(num(l.price) * (1 - num(l.disc_pct) / 100)), amt = Math.round(num(l.qty) * net);
    L.push((i + 1) + '. ' + l.name + (l.spec ? ' (' + l.spec + ')' : '') + (l.model ? ' – ' + l.model : '') + (l.brand ? ' – ' + l.brand : ''));
    L.push('    ' + N(l.qty) + ' ' + (l.unit || '') + ' × ' + M(net) + ' = ' + M(amt));
  });
  L.push('', 'Cộng tiền hàng: ' + M(sm.sub), sm.groups.map(function (g) { return 'VAT ' + N(g.rate) + '%: ' + M(g.vat); }).join('\n'), 'TỔNG CỘNG: ' + M(sm.total) + ' đ', '');
  if (rec.valid_text) L.push('Hiệu lực: ' + rec.valid_text);
  if (rec.deliver_time) L.push('Giao hàng: ' + rec.deliver_time);
  if (rec.deliver_place) L.push('Địa điểm: ' + rec.deliver_place);
  if (rec.pay_method) L.push('Thanh toán: ' + rec.pay_method);
  if (rec.warranty_text) L.push('Bảo hành: ' + rec.warranty_text);
  L.push('', (S.cfg && S.cfg.company_name) || 'HA TO');
  return L.join('\n');
}
function quoteQuickSend(rec, lines) {
  return quoteCheck(rec, lines, 'gửi').then(function (ok) {
    if (!ok) return;
    var txt = quoteZaloText(rec, lines), ta = h('textarea', { style: 'width:100%;height:50vh;font-family:inherit' }); ta.value = txt;
    copyText(txt).then(function (c) { toast(c ? 'Đã sao chép — dán vào Zalo' : 'Chọn toàn bộ nội dung rồi sao chép', !c); });
    modal({ title: 'Gửi báo giá nhanh', body: ta, dismiss: true, buttons: [{ label: 'Sao chép lại', cls: 'pri', fn: function () { ta.select(); copyText(ta.value).then(function () { toast('Đã sao chép'); }); } }] });
  });
}

/* ---- Tìm kiếm chung ---- */
(function () {
  var bar = document.getElementById('bar'); if (!bar) return;
  var box = h('div', { id: 'gsw', style: 'position:relative' }), inp = h('input', { id: 'gs', type: 'search', placeholder: 'Tìm nhanh… (Ctrl+K)', style: 'width:200px;max-width:34vw' }), dd = h('div', { class: 'dd', style: 'display:none;position:absolute;right:0;top:34px;min-width:300px;max-height:60vh;overflow:auto;z-index:60' });
  box.append(inp, dd); bar.insertBefore(box, document.getElementById('acts'));
  var t = null, seq = 0;
  function hide() { dd.style.display = 'none'; }
  function nav(kind, x) {
    hide(); inp.value = '';
    if (kind === 'customers') { go('customer/' + x.id); if (false) setTimeout(function () { var c = S.customers.filter(function (y) { return y.id === x.id; })[0]; if (c && typeof customerModal === 'function') customerModal(c, route); }, 150); }
    else if (kind === 'projects') go('project/' + x.id);
    else if (kind === 'quotes') go('quote/' + x.id);
    else if (kind === 'docs') go('doc/' + x.id);
    else go('delivery/' + x.id);
  }
  function draw(r) {
    dd.innerHTML = ''; var n = 0, T = { customers: 'Khách hàng', projects: 'Dự án', quotes: 'Báo giá', docs: 'Hợp đồng / PO', deliveries: 'Giao hàng' };
    Object.keys(T).forEach(function (k) {
      var a = r[k] || []; if (!a.length) return; n += a.length;
      dd.appendChild(h('div', { class: 'mut', style: 'padding:4px 8px;font-size:11px;text-transform:uppercase' }, T[k]));
      a.forEach(function (x) { dd.appendChild(h('div', { class: 'it', style: 'padding:5px 8px;cursor:pointer', onmousedown: function (e) { e.preventDefault(); nav(k, x); } }, h('div', null, x.label), x.sub ? h('div', { class: 'mut', style: 'font-size:12px' }, x.sub) : null)); });
    });
    if (!n) dd.appendChild(h('div', { class: 'mut', style: 'padding:8px' }, 'Không có kết quả'));
    dd.style.display = 'block';
  }
  inp.addEventListener('input', function () {
    clearTimeout(t); var q = inp.value.trim(); if (q.length < 2) { hide(); return; }
    t = setTimeout(function () { var my = ++seq; raw('search', { q: q }, true).then(function (r) { if (my === seq) draw(r); }).catch(function () { }); }, 250);
  });
  inp.addEventListener('blur', function () { setTimeout(hide, 150); });
  document.addEventListener('keydown', function (e) { if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); inp.focus(); inp.select(); } else if (e.key === 'Escape' && document.activeElement === inp) { inp.blur(); } });
})();

/* ---- Gói đối chiếu (PO + giao hàng từng ngày) ---- */
function reconModal(projectId) {
  safe(call('reconcile', { project_id: projectId })).then(function (d) {
    if (!d) return;
    var st = { mode: 'khach', off: {} };
    var ctl = h('div', { class: 'bar2', style: 'flex-wrap:wrap;gap:10px' }), host = h('div');
    function cols() {
      var c = [{ k: 'stt', label: 'STT', g: function (r, i) { return i + 1; } }, { k: 'name', label: 'Tên hàng', g: function (r) { return r.name; } }, { k: 'model', label: 'Model / Mã', g: function (r) { return r.model || r.code || ''; } }, { k: 'unit', label: 'ĐVT', g: function (r) { return r.unit; } },
        { k: 'qty', label: 'SL theo ' + (d.basis === 'PO' ? 'PO' : d.basis === 'MIX' ? 'HĐ / PO' : 'HĐ'), n: 1, g: function (r) { return r.qty; } }];
      d.dates.forEach(function (x) { c.push({ k: 'd:' + x.date, label: 'Giao ' + D(x.date), sub: x.codes, n: 1, g: function (r) { return r.by[x.date] || ''; } }); });
      c.push({ k: 'del', label: 'Tổng đã giao', n: 1, g: function (r) { return r.delivered; } }, { k: 'rem', label: 'Còn lại', n: 1, g: function (r) { return r.remaining; } });
      if (st.mode === 'ketoan') {
        c.push({ k: 'price', label: 'Đơn giá (chưa VAT)', n: 1, m: 1, g: function (r) { return r.price; } }, { k: 'val', label: 'Giá trị PO (chưa VAT)', n: 1, m: 1, g: function (r) { return Math.round(r.qty * r.price); } });
        if (d.can_cost) c.push({ k: 'cost', label: 'Giá mua', n: 1, m: 1, g: function (r) { return r.cost; } }, { k: 'profit', label: 'Lãi gộp', n: 1, m: 1, g: function (r) { return Math.round(r.qty * (r.price - r.cost)); } });
      }
      return c;
    }
    function shown() { return cols().filter(function (c) { return !st.off[c.k]; }); }
    function html() {
      var cs = shown(), th = cs.map(function (c) { return '<th>' + esc(c.label) + (c.sub ? '<div class="m" style="font-weight:400;font-size:10px">' + esc(c.sub) + '</div>' : '') + '</th>'; }).join('');
      var tr = d.rows.map(function (r, i) { return '<tr>' + cs.map(function (c) { var v = c.g(r, i); return '<td class="' + (c.n ? 'r' : '') + '">' + (c.n && v !== '' ? (c.m ? M(v) : N(v)) : esc(v)) + '</td>'; }).join('') + '</tr>'; }).join('');
      var tot = '';
      if (st.mode === 'ketoan') { var sv = 0, sp = 0; d.rows.forEach(function (r) { sv += r.qty * r.price; if (d.can_cost) sp += r.qty * (r.price - r.cost); }); tot = '<p><b>Tổng giá trị (chưa VAT): ' + M(sv) + '</b>' + (d.can_cost ? ' · Lãi gộp: ' + M(sp) : '') + '</p>'; }
      return '<!doctype html><meta charset="utf-8">' + PRINT_CSS + '<h2>BẢNG ĐỐI CHIẾU SỐ LƯỢNG ' + (d.basis === 'PO' ? 'ĐẶT HÀNG / GIAO HÀNG' : 'HỢP ĐỒNG / GIAO HÀNG') + '</h2><div>Dự án: <b>' + esc(d.project.code + ' · ' + d.project.name) + '</b></div><div>Khách hàng: ' + esc(d.customer.name) + '</div><div class="m">Ngày lập: ' + D(today()) + ' · Chỉ tính các đợt đã giao</div><table><thead><tr>' + th + '</tr></thead><tbody>' + tr + '</tbody></table>' + tot;
    }
    function toXlsx() {
      var cs = shown(), rows = [cs.map(function (c) { return c.label + (c.sub ? ' (' + c.sub + ')' : ''); })];
      d.rows.forEach(function (r, i) { rows.push(cs.map(function (c) { return c.g(r, i); })); });
      XlsxWrite.download('Doi_chieu_' + d.project.code + '.xlsx', [{ name: 'Doi chieu', rows: rows, widths: cs.map(function (c) { return c.k === 'name' ? 42 : c.k === 'model' ? 20 : 14; }), boldRows: [0] }]);
    }
    var fr = h('iframe', { style: 'width:100%;height:60vh;border:1px solid #d1d5db;background:#fff' });
    function draw() {
      ctl.innerHTML = '';
      ctl.appendChild(h('label', null, 'Gửi cho: ', sel([['khach', 'Khách hàng (không giá mua / lãi)'], ['ketoan', 'Kế toán (có giá trị' + (d.can_cost ? ', giá mua, lãi' : '') + ')']], st.mode, function (e) { st.mode = e.target.value; draw(); })));
      ctl.appendChild(h('span', { class: 'mut' }, 'Bỏ chọn cột để ẩn (các cột còn lại tự dàn đều khi in):'));
      cols().forEach(function (c) { if (c.k === 'stt' || c.k === 'name') return; ctl.appendChild(h('label', { style: 'white-space:nowrap' }, h('input', { type: 'checkbox', checked: !st.off[c.k], onchange: function (e) { st.off[c.k] = !e.target.checked; fr.srcdoc = html(); } }), ' ' + c.label)); });
      fr.srcdoc = html();
    }
    host.append(ctl, fr);
    modal({ title: 'Gói đối chiếu — ' + d.project.code, wide: true, body: host, buttons: [{ label: 'In / Lưu PDF', cls: 'pri', fn: function () { try { fr.contentWindow.focus(); fr.contentWindow.print(); } catch (e) { toast('Trình duyệt chặn in.', true); } } }, { label: 'Tải Excel', fn: toXlsx }] });
    draw();
  });
}

/* ---- Tóm tắt một trang cho dự án ---- */
function projectSummaryPrint(b) {
  var pj = b.project, s = b.summary, mo = b.money, vat = 1 + (num((b.docs[0] || {}).vat_pct) || 10) / 100, canP = S.perms.canPrice && s.profit !== undefined;
  var kv = function (k, v) { return '<tr><td>' + esc(k) + '</td><td class="r"><b>' + esc(v) + '</b></td></tr>'; };
  var money = kv('Giá trị ký (chưa VAT) — theo ' + (mo.basis === 'PO' ? 'PO' : mo.basis === 'MIX' ? 'HĐ + PO' : 'hợp đồng'), M(s.value)) + kv('Đã giao (chưa VAT)', M(s.delivered_value) + ' (' + P(s.delivered_pct) + ')') + kv('Doanh thu ghi nhận (chưa VAT)', M(s.revenue)) +
    kv('Tổng giá trị ký (có VAT)', M(Math.round(s.value_vat || mo.total_vat))) + kv('Đã thu (có VAT)', M(mo.paid)) + kv('Còn phải thu theo hàng đã giao (có VAT)', M(Math.round(s.revenue_vat - mo.paid)));
  if (canP) money += kv('Giá vốn (phần đã giao)', M(s.cogs)) + kv('Chi phí phát sinh', M(s.cost_hato)) + kv('Lợi nhuận gộp (thực tế)', M(s.profit_real) + (s.revenue ? ' (' + P(s.margin_real) + ')' : '')) + kv('Lãi dự kiến (theo giá trị ký)', M(s.profit) + ' (' + P(s.margin) + ')');
  var docs = b.docs.map(function (d) { return '<tr><td>' + esc(d.code) + '</td><td>' + esc(TYPE_LB[d.type] || d.type) + '</td><td>' + esc(d.doc_no || '') + '</td><td>' + D(d.sign_date) + '</td><td class="r">' + M(d.current_value != null ? d.current_value : d.value) + '</td></tr>'; }).join('');
  var lines = b.lines.filter(function (l) { return l.in_basis !== false; }).map(function (l, i) { return '<tr><td>' + (i + 1) + '</td><td>' + esc(l.name) + '</td><td>' + esc(l.unit || '') + '</td><td class="r">' + N(l.qty) + '</td><td class="r">' + N(l.delivered || 0) + '</td><td class="r">' + N(l.remaining != null ? l.remaining : l.qty) + '</td></tr>'; }).join('');
  var html = '<!doctype html><meta charset="utf-8">' + PRINT_CSS.replace('A4 landscape', 'A4 portrait') + '<h2>TÓM TẮT DỰ ÁN</h2><div><b>' + esc(pj.code + ' · ' + pj.name) + '</b></div><div>Khách hàng: ' + esc(b.customer.name || '') + ' · Trạng thái: ' + esc(pj.status) + '</div><div class="m">Ngày lập: ' + D(today()) + '</div>' +
    '<h3>Tài chính</h3><table>' + money + '</table><h3>Văn bản</h3><table><thead><tr><th>Mã</th><th>Loại</th><th>Số</th><th>Ngày ký</th><th>Giá trị hiện hành (chưa VAT)</th></tr></thead><tbody>' + (docs || '<tr><td colspan="5">Chưa có</td></tr>') + '</tbody></table>' +
    '<h3>Giao hàng theo dòng</h3><table><thead><tr><th>#</th><th>Tên hàng</th><th>ĐVT</th><th>SL</th><th>Đã giao</th><th>Còn lại</th></tr></thead><tbody>' + (lines || '<tr><td colspan="6">Chưa có</td></tr>') + '</tbody></table>';
  printPreview('Tóm tắt — ' + pj.code, html);
}

/* ===== Công việc hằng ngày: bảng việc, nhắc việc, lặp lại ===== */
var TASK_TYPES = ['Báo giá', 'Gọi khách', 'Giao hàng', 'Hợp đồng / PO', 'Thanh toán', 'Mua hàng', 'Khác'], TASK_STS = ['Chưa làm', 'Đang làm', 'Chờ phản hồi', 'Xong'];
var REP_LB = { '': 'Không lặp', day: 'Hằng ngày', week: 'Hằng tuần', month: 'Hằng tháng' };
function remLabel(r) { if (r === '' || r == null) return 'Không nhắc'; var n = Number(r); return n === 0 ? 'Đúng hạn' : (n % 7 === 0 ? 'Trước ' + (n / 7) + ' tuần' : 'Trước ' + n + ' ngày'); }
function dayDiff(a, b) { return Math.round((new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00')) / 86400000); }
function addD(s, n) { var d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function taskIsOpen(t) { return t.status !== 'Xong'; }
function taskLeft(t, td) {
  if (t.status === 'Xong') return h('span', { class: 'badge b-ok' }, '✓ ' + D(t.done_at));
  var e = t.end_date || t.start_date; if (!e) return h('span', { class: 'mut' }, 'Không hạn');
  var n = dayDiff(e, td);
  return n < 0 ? h('span', { class: 'badge b-bad' }, 'Trễ ' + (-n) + ' ngày') : n === 0 ? h('span', { class: 'badge b-warn' }, 'Hôm nay') : h('span', { class: 'badge ' + (n <= 3 ? 'b-warn' : 'b-info') }, 'Còn ' + n + ' ngày');
}
function taskModal(t, pid, done) {

      }, function (e) { st.textContent = ''; toast('Không xóa: ' + ((e && e.message) || e), true); });
    } }] });
  });
}
</script>
