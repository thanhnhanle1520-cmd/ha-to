<script>
/* ===== Tờ khai nhập khẩu (bản 31) =====
   Kéo file ECUS (ToKhaiHQ7N_*.xlsx) vào → app tự đọc trang 1–2 (thông tin chung) và trang 3+ (mỗi trang 1 dòng hàng) → xem lại → Lưu.
   Giá vốn/đvt = Đơn giá tính thuế + Thuế NK/đvt (chi phí phát sinh KHÔNG cộng vào). Dòng tờ khai gắn dòng HĐ/PO → giá mua chốt tự điền như đơn mua.
   Mô tả hải quan chỉ dùng nội bộ (đối chiếu, xuất hóa đơn) — không in ra Báo giá / BBGH / BBCT. */
var IMP_ST = { THONG_QUAN: 'Đã thông quan', NHAP: 'Nháp', HUY: 'Hủy' }, IMP_CLS = { THONG_QUAN: 'b-ok', NHAP: '', HUY: 'b-bad' };
var IMP_CH = { XANH: 'Xanh', VANG: 'Vàng', DO: 'Đỏ' }, IMP_CHC = { XANH: 'b-ok', VANG: 'b-warn', DO: 'b-bad' };
function impBadge(st) { return h('span', { class: 'badge ' + (IMP_CLS[st] || '') }, IMP_ST[st] || st || ''); }
function chBadge(c) { return c ? h('span', { class: 'badge ' + (IMP_CHC[c] || ''), title: 'Phân luồng hải quan' }, 'Luồng ' + IMP_CH[c]) : null; }
function impNewId(p) { return p + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 7); }
/* đọc 1 file → kết quả TkParse (head, items, checks, errors, warnings) */
function tkReadFile(file) {
  if (!/\.xlsx$/i.test(file.name)) return Promise.reject(new Error(file.name + ': cần file .xlsx xuất từ ECUS.'));
  return file.arrayBuffer().then(XlsxLite.read).then(function (book) { var r = TkParse.parseBook(book); r.file_name = file.name; return r; });
}
/* gợi ý mã hàng + NCC + tờ khai trùng số */
function tkPrepare(r) {
  return call('importPrepare', { decl_no: r.head.decl_no, exporter_name: r.head.exporter_name, contract_no: r.head.contract_no, items: r.items.map(function (it) { return { description: it.description, model: it.model, brand: it.brand }; }) }).then(function (x) {
    r.prep = x; r.items.forEach(function (it, i) { var s = x.suggest[i]; if (s && !it.item_code) { it.item_code = s.code; it.item_name = s.name; it.code_by = s.by; } });
    if (x.my_tax && r.head.importer_tax && x.my_tax !== r.head.importer_tax) r.warnings.push('Mã số thuế người nhập khẩu trên tờ khai (' + r.head.importer_tax + ') khác MST công ty trong Cấu hình (' + x.my_tax + ').');
    return r;
  });
}
function tkPayload(r, extra) {
  var H = r.head;
  var rec = Object.assign({ decl_no: H.decl_no, reg_date: H.reg_date, type_code: H.type_code, customs_office: H.customs_office, channel: H.channel, exporter_name: H.exporter_name, exporter_country: H.exporter_country, exporter_address: H.exporter_address,
    bill_no: H.bill_no, port: H.port, arrival_date: H.arrival_date, release_date: H.release_date, packages: H.packages, package_unit: H.package_unit, gross_kg: H.gross_kg, invoice_no: H.invoice_no, invoice_date: H.invoice_date,
    contract_no: H.contract_no, contract_date: H.contract_date, incoterm: H.incoterm, currency: H.currency, pay_method: H.pay_method, invoice_total: H.invoice_total, exchange_rate: H.exchange_rate, taxable_total: H.taxable_total,
    tax_payable: H.tax_payable, pages: H.pages, status: 'THONG_QUAN', checks: r.checks, file_name: r.file_name || '', supplier_id: r.prep && r.prep.supplier ? r.prep.supplier.id : '' }, extra || {});
  return { rec: rec, items: r.items.map(function (it) { var o = {}; ['id', 'line_no', 'hs_code', 'description', 'model', 'brand', 'origin', 'origin_name', 'qty', 'unit', 'qty2', 'unit2', 'inv_price', 'inv_value', 'inv_currency', 'tax_value', 'tax_unit_price', 'nk_rate', 'nk_amount', 'nk_exempt', 'vat_rate', 'vat_amount', 'other_tax', 'other_taxes', 'item_code', 'item_name'].forEach(function (k) { if (it[k] != null) o[k] = it[k]; }); return o; }) };
}
/* nhập file: 1 file → màn hình xem lại; nhiều file → lưu thẳng các tờ khai đọc sạch, báo lại tờ khai cần xem */
function tkImportFiles(files) {
  files = Array.prototype.slice.call(files || []); if (!files.length) return;
  if (files.length === 1) return tkReadFile(files[0]).then(tkPrepare).then(function (r) {
    if (r.errors.length) return modal({ title: 'Không đọc được tờ khai', body: h('ul', null, r.errors.map(function (e) { return h('li', null, e); })) });
    if (r.prep.existing) return modal({ title: 'Tờ khai ' + r.head.decl_no + ' đã có', body: h('p', null, 'Tờ khai này đã lưu (' + r.prep.existing.code + '). Cập nhật theo file mới (tờ khai sửa đổi)? Mã hàng và phần gắn dự án của các dòng cùng số được giữ lại.'),
      buttons: [{ label: 'Cập nhật theo file', cls: 'pri', fn: function (c) { c(); S.tkDraft = r; go('import/' + r.prep.existing.id + '?upd=1'); } }], closeLabel: 'Thôi' });
    r.items.forEach(function (it) { it.id = impNewId('TI'); });
    S.tkDraft = r; go('import/new');
  }).catch(function (e) { toast(e.message || String(e), true); });
  var ok = [], bad = [], i = 0;
  (function next() {
    if (i >= files.length) {
      MEMO = {}; route();
      return modal({ title: 'Đã nhập ' + ok.length + '/' + files.length + ' tờ khai', body: h('div', null, ok.length ? h('p', null, 'Đã lưu: ' + ok.join(', ')) : null, bad.length ? h('div', null, h('b', null, 'Chưa lưu (mở từng file để xem):'), h('ul', null, bad.map(function (b) { return h('li', null, b); }))) : null) });
    }
    var f = files[i++];
    tkReadFile(f).then(tkPrepare).then(function (r) {
      if (r.errors.length) { bad.push(f.name + ': ' + r.errors[0]); return; }
      if (r.prep.existing) { bad.push(f.name + ': tờ khai ' + r.head.decl_no + ' đã có'); return; }
      if (r.checks.some(function (c) { return !c.ok; })) { bad.push(f.name + ': số liệu không khớp (' + r.warnings[0] + ')'); return; }
      return raw('importSave', tkPayload(r)).then(function () { ok.push(r.head.decl_no); });
    }).catch(function (e) { bad.push(f.name + ': ' + (e.message || e)); }).then(next);
  })();
}
function tkFileInput() {
  var inp = h('input', { type: 'file', accept: '.xlsx', multiple: true, style: 'display:none', onchange: function () { tkImportFiles(inp.files); inp.value = ''; } });
  return inp;
}

  if (tab === 'report') return impReport(v, tabs);
  return call('importList', {}).then(function (rows) {
    v.innerHTML = ''; v.appendChild(tabs);
    if (S.perms.imports.create) v.appendChild(tkDrop(inp));
    v.appendChild(table({ rows: rows, xls: 'To_khai_nhap_khau', empty: 'Chưa có tờ khai nào. Bấm "+ Nhập file tờ khai" và chọn file Excel xuất từ ECUS (ToKhaiHQ7N_…xlsx).',
      search: function (r) { return [r.decl_no, r.exporter_name, r.invoice_no, r.contract_no, r.bill_no, r.code].join(' '); },
      filters: [{ label: 'Mọi luồng', opts: Object.keys(IMP_CH).map(function (k) { return [k, 'Luồng ' + IMP_CH[k]]; }), get: function (r) { return r.channel; } }],

        { k: 'channel', label: 'Luồng', val: function (r) { return IMP_CH[r.channel] || ''; }, fmt: function (r) { return chBadge(r.channel) || ''; } },
        { k: 'exporter_name', label: 'Người xuất khẩu', max: 28 }, { k: 'invoice_no', label: 'Số hóa đơn' }, { k: 'contract_no', label: 'Số HĐ ngoại' },
        { k: 'n_lines', label: 'Dòng', cls: 'r' }, { k: 'taxable_total', label: 'Trị giá tính thuế', cls: 'r', fmt: function (r) { return M(r.taxable_total); } },
        { k: 'nk_total', label: 'Thuế NK', cls: 'r', fmt: function (r) { return M(r.nk_total); } }, { k: 'vat_total', label: 'VAT NK', cls: 'r', fmt: function (r) { return M(r.vat_total); } },
        { k: 'alloc_pct', label: 'Đã gắn dự án', cls: 'r', fmt: function (r) { return h('span', { class: r.alloc_pct >= 0.999 ? 'pos' : r.alloc_pct > 0 ? '' : 'mut' }, P(r.alloc_pct)); } },

      foot: function (rs) { var t = 0, nk = 0, vt = 0; rs.forEach(function (r) { t += r.taxable_total; nk += r.nk_total; vt += r.vat_total; }); return h('tr', null, h('td', { colspan: 8, class: 'r' }, 'Cộng ' + rs.length + ' tờ khai'), h('td', { class: 'r' }, h('b', null, M(t))), h('td', { class: 'r' }, h('b', null, M(nk))), h('td', { class: 'r' }, h('b', null, M(vt))), h('td', { colspan: 2 })); },
      onRow: function (r) { go('import/' + r.id); } }));
  });
};
function tkDrop(inp) {
  var z = h('div', { class: 'card tkdrop', tabindex: 0, role: 'button', 'aria-label': 'Kéo thả file tờ khai vào đây hoặc bấm để chọn file', onclick: function () { inp.click(); }, onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); inp.click(); } } },
    h('b', null, 'Kéo thả file tờ khai vào đây'), h('span', { class: 'mut' }, ' hoặc bấm để chọn · file Excel xuất từ ECUS (ToKhaiHQ7N_…xlsx), chọn được nhiều file cùng lúc'));
  z.addEventListener('dragover', function (e) { e.preventDefault(); z.classList.add('on'); });
  z.addEventListener('dragleave', function () { z.classList.remove('on'); });
  z.addEventListener('drop', function (e) { e.preventDefault(); z.classList.remove('on'); tkImportFiles(e.dataTransfer.files); });

}

  var host = h('div');
  function load() {
    st.from = fr.value; st.to = to.value; st.by = by.value;
    return call('importReport', { from: st.from, to: st.to }).then(function (rows) {
      host.innerHTML = '';
      var key = { month: function (r) { return String(r.reg_date).slice(0, 7); }, exporter: function (r) { return r.exporter || '(không rõ)'; }, country: function (r) { return r.origin || '(không rõ)'; }, hs: function (r) { return r.hs_code; }, decl: function (r) { return r.decl_no; } }[st.by];
      var g = {}, order = []; rows.forEach(function (r) { var k = key(r), x = g[k]; if (!x) { x = g[k] = { id: k, k: k, decls: {}, n: 0, tv: 0, nk: 0, vat: 0, oth: 0 }; order.push(k); } x.decls[r.decl_no] = 1; x.n++; x.tv += r.tax_value; x.nk += r.nk_amount; x.vat += r.vat_amount; x.oth += r.other_tax; });
      var grp = order.map(function (k) { var x = g[k]; x.nd = Object.keys(x.decls).length; return x; }).sort(function (a, b) { return st.by === 'month' ? String(b.k).localeCompare(String(a.k)) : b.tv - a.tv; });
      var lbl = by.options[by.selectedIndex].text.replace('Theo ', '');
      var T = { nd: 0, n: 0, tv: 0, nk: 0, vat: 0 }; var dset = {}; rows.forEach(function (r) { dset[r.decl_no] = 1; T.n++; T.tv += r.tax_value; T.nk += r.nk_amount; T.vat += r.vat_amount; }); T.nd = Object.keys(dset).length;
      host.appendChild(h('div', { class: 'grid g3', style: 'margin-bottom:12px' }, [['Số tờ khai', N(T.nd), T.n + ' dòng hàng'], ['Trị giá tính thuế', M(T.tv), 'VND'], ['Thuế nhập khẩu', M(T.nk), T.tv > 0 ? 'bình quân ' + N(Math.round(T.nk / T.tv * 10000) / 100) + '% trị giá' : ''], ['Thuế GTGT nhập khẩu', M(T.vat), 'được khấu trừ, không vào giá vốn']].map(function (k) { return h('div', { class: 'kpi' }, h('div', { class: 'l' }, k[0]), h('div', { class: 'v' }, k[1]), h('div', { class: 'l' }, k[2])); })));
      host.appendChild(h('div', { class: 'card' }, h('h3', null, 'Tổng hợp ' + lbl.toLowerCase()), table({ rows: grp, xls: 'Thue_NK_tong_hop', empty: 'Không có tờ khai trong kỳ.',
        cols: [{ k: 'k', label: lbl.charAt(0).toUpperCase() + lbl.slice(1), fmt: function (r) { return st.by === 'month' ? r.k.slice(5) + '/' + r.k.slice(0, 4) : r.k; } }, { k: 'nd', label: 'Số tờ khai', cls: 'r' }, { k: 'n', label: 'Dòng hàng', cls: 'r' },
          { k: 'tv', label: 'Trị giá tính thuế', cls: 'r', fmt: function (r) { return M(r.tv); } }, { k: 'nk', label: 'Thuế NK', cls: 'r', fmt: function (r) { return M(r.nk); } }, { k: 'vat', label: 'Thuế GTGT NK', cls: 'r', fmt: function (r) { return M(r.vat); } }, { k: 'oth', label: 'Thuế khác', cls: 'r', fmt: function (r) { return r.oth ? M(r.oth) : ''; } }] })));
      rows.forEach(function (r, i) { r.id = r.decl_id + ':' + r.line_no; });
      host.appendChild(h('div', { class: 'card' }, h('h3', null, 'Chi tiết dòng hàng'), table({ rows: rows, xls: 'Thue_NK_chi_tiet', pageSize: 30, search: function (r) { return [r.decl_no, r.description, r.model, r.hs_code, r.exporter, r.item_code].join(' '); },
        cols: [{ k: 'decl_no', label: 'Số tờ khai', fmt: function (r) { return h('span', { class: 'code' }, r.decl_no); } }, { k: 'reg_date', label: 'Ngày ĐK', fmt: function (r) { return D(r.reg_date); } }, { k: 'line_no', label: 'Dòng', cls: 'r' },
          { k: 'hs_code', label: 'Mã HS' }, { k: 'description', label: 'Mô tả hàng hóa', max: 40 }, { k: 'origin', label: 'Xuất xứ' }, { k: 'qty', label: 'SL', cls: 'r', fmt: function (r) { return N(r.qty) + ' ' + r.unit; } },
          { k: 'tax_value', label: 'Trị giá tính thuế', cls: 'r', fmt: function (r) { return M(r.tax_value); } }, { k: 'nk_rate', label: 'TS NK', cls: 'r', fmt: function (r) { return N(r.nk_rate) + '%'; } }, { k: 'nk_amount', label: 'Thuế NK', cls: 'r', fmt: function (r) { return M(r.nk_amount); } },
          { k: 'vat_amount', label: 'Thuế GTGT', cls: 'r', fmt: function (r) { return M(r.vat_amount); } }, { k: 'cost_unit', label: 'Giá vốn/đvt', cls: 'r', fmt: function (r) { return M(r.cost_unit); } }],

/* ---- Trang 1 tờ khai: xem lại sau khi đọc file / chi tiết đã lưu ---- */
PAGES.import = function (p, q) {
  var id = p[1], isNew = id === 'new', upd = !isNew && q.upd === '1' && S.tkDraft, v = $('#view');
  if (isNew && !S.tkDraft) { go('imports'); return; }
  var ld = isNew ? Promise.resolve(null) : call('importGet', { id: id });
  return Promise.all([ld]).then(function (a) {
    var g = a[0], dr = S.tkDraft, canCat = S.perms.pricelist && S.perms.pricelist.create;
    var canEdit = isNew ? S.perms.imports.create : S.perms.imports.edit;
    var decl, items, allocs, checks, warns = [];
    if (isNew) { decl = Object.assign({ status: 'THONG_QUAN', supplier_id: dr.prep.supplier ? dr.prep.supplier.id : '', purchase_id: '', extra_costs: [] }, tkPayload(dr).rec); items = dr.items; allocs = []; checks = dr.checks; warns = dr.warnings; }
    else {
      decl = g.decl; allocs = g.allocs.slice(); checks = decl.checks || [];
      items = g.items.map(function (x) { return Object.assign({}, x); });
      if (upd) {        // tờ khai sửa đổi: lấy số liệu file mới, giữ id + mã hàng theo số dòng
        var byLn = {}; items.forEach(function (x) { byLn[x.line_no] = x; });
        items = dr.items.map(function (x) { var o = byLn[x.line_no]; return Object.assign({}, x, { id: o ? o.id : impNewId('TI'), item_code: o && o.item_code ? o.item_code : x.item_code, item_name: o && o.item_code ? o.item_name : x.item_name, allocated: o ? o.allocated : 0 }); });
        decl = Object.assign({}, decl, tkPayload(dr).rec, { status: decl.status, supplier_id: decl.supplier_id || (dr.prep.supplier || {}).id || '', purchase_id: decl.purchase_id, extra_costs: decl.extra_costs, note: decl.note });
        checks = dr.checks; warns = dr.warnings.concat(['Đang cập nhật theo file ' + dr.file_name + ' — bấm "Lưu tờ khai" để ghi.']);
      }
    }
    S.tkDraft = isNew || upd ? S.tkDraft : null;
    items.forEach(function (it) { var c = TkParse.costOf(it); it._c = c; });
    v.innerHTML = '';
    /* --- đầu trang: thông tin chung --- */
    // Tờ khai là chứng từ cố định: thông tin lấy theo file, chỉ ghi chú nội bộ là nhập tay (bản 32)
    var f = form([{ k: 'note', label: 'Ghi chú nội bộ', full: true }], decl);
    var kv = function (l, val) { return val ? h('div', { class: 'tkkv' }, h('span', { class: 'mut' }, l), h('b', null, val)) : null; };
    var H = decl;
    var head = h('div', { class: 'card' },
      h('div', { class: 'bar2', style: 'margin-bottom:8px' }, h('span', { style: 'font-size:18px;font-weight:700', class: 'code' }, 'TK ' + H.decl_no), H.status === 'HUY' ? impBadge(H.status) : null, chBadge(H.channel), H.type_code ? h('span', { class: 'badge b-info' }, H.type_code) : null,
        h('span', { class: 'mut', style: 'margin-left:auto' }, (H.file_name ? 'File: ' + H.file_name : '') + (H.created_by ? ' · ' + H.created_by : ''))),
      h('div', { class: 'tkgrid' }, kv('Ngày đăng ký', D(H.reg_date)), kv('Ngày cấp phép', D(H.release_date)), kv('Hải quan', H.customs_office), kv('Người xuất khẩu', [H.exporter_name, H.exporter_country].filter(Boolean).join(' · ')),
        kv('Số vận đơn', H.bill_no), kv('Ngày hàng đến', D(H.arrival_date) + (H.port ? ' · ' + H.port : '')), kv('Số kiện / trọng lượng', H.packages ? N(H.packages) + ' ' + (H.package_unit || '') + ' · ' + N(H.gross_kg) + ' kg' : ''),
        kv('Số hóa đơn', [H.invoice_no, D(H.invoice_date)].filter(Boolean).join(' · ')), kv('Hợp đồng ngoại', [H.contract_no, D(H.contract_date)].filter(Boolean).join(' · ')),
        kv('Tổng trị giá hóa đơn', H.invoice_total ? [H.incoterm, H.currency, N(H.invoice_total)].filter(Boolean).join(' ') : ''), kv('Tỷ giá tính thuế', H.exchange_rate ? M(H.exchange_rate) : ''),
        kv('Trị giá tính thuế', M(H.taxable_total) + ' đ'), kv('Thuế phải nộp', H.tax_payable ? M(H.tax_payable) + ' đ' : '')),
      h('div', { style: 'margin-top:10px' }, f.el));
    v.appendChild(head);

      function show() { var t = tk.filter(function (x) { return x.id === ss.value; })[0]; c1.textContent = t ? M(t.base) : ''; c2.textContent = t ? M(t.tax) : ''; c3.innerHTML = ''; if (t) c3.appendChild(h('b', null, M(t.cost))); }

      h('div', { class: 'tw', style: 'max-height:60vh;overflow:auto' }, h('table', { class: 't' }, h('thead', null, h('tr', null, h('th', null, 'Hàng trong văn bản'), h('th', null, 'Dòng tờ khai'), h('th', { class: 'r' }, 'SL gắn'), h('th', { class: 'r' }, 'Đơn giá tính thuế'), h('th', { class: 'r' }, 'Thuế NK/đvt'), h('th', { class: 'r' }, 'Giá vốn/đvt'))), tb))),
